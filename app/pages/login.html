<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../static/css/style.css">
  <title>Pantaneira Digital | Login</title>
</head>
<body>
  <!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Acesso remoto · Pantaneira Digital</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<klink src="../static/css/style.css">
</head>
<body>
  <main class="tela">
    <section class="marca">
      <img src="../static/src/vetor.svg" alt="Pantaneira Digital — Soluções em TI" fetchpriority="high">
    </section>

    <section class="acesso">
      <div class="form-wrap">
        <h1>Acesso remoto</h1>
        <p class="intro">Entre com o usuário e a senha fornecidos pela Pantaneira Digital.</p>

        <form method="post" autocomplete="on" id="loginForm">
          <div class="campo">
            <label for="username">Usuário</label>
            <input id="username" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus>
          </div>

          <div class="campo">
            <label for="password">Senha</label>
            <div class="entrada">
              <input id="password" name="password" type="password" autocomplete="current-password" required>
              <button type="button" class="mostrar" aria-controls="password" aria-pressed="false">Mostrar</button>
            </div>
          </div>

          <p id="error" role="alert" hidden></p>

          <button type="submit" class="entrar" id="button">Entrar</button>
        </form>
      </div>
    </section>
  </main>
</body>
  <script src="../static/js/login.js"></script>
</body>
</html>
