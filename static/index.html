<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda RustDesk</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Contatos RustDesk</h1>
            <div class="toolbar">
                <input type="text" id="searchInput" placeholder="Buscar por apelido, ID ou dispositivo...">
                <button id="btnNovoCliente" class="btn-primary">+ Novo Contato</button>
            </div>
        </header>

        <!-- Formulário de Cadastro (oculto por padrão) -->
        <section id="formSection" class="card hidden">
            <h2>Adicionar / Editar Contato</h2>
            <form id="clientForm">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="clientId">ID RustDesk (9 dígitos)</label>
                        <input type="text" id="clientId" maxlength="9" pattern="[0-9]{9}" placeholder="123456789" required>
                    </div>
                    <div class="form-group">
                        <label for="clientName">Apelido</label>
                        <input type="text" id="clientName" maxlength="50" placeholder="Ex: João - Financeiro">
                    </div>
                    <div class="form-group">
                        <label for="clientDevice">Dispositivo</label>
                        <input type="text" id="clientDevice" maxlength="50" placeholder="Ex: Notebook Dell">
                    </div>
                    <div class="form-group">
                        <label for="clientPasswd">Senha (até 6 caracteres)</label>
                        <input type="text" id="clientPasswd" maxlength="6" placeholder="Ex: 123456">
                    </div>
                </div>
                <div class="form-actions">
                    <button type="button" id="btnCancelar" class="btn-secondary">Cancelar</button>
                    <button type="submit" class="btn-primary">Salvar</button>
                </div>
            </form>
        </section>

        <!-- Lista Telefônica -->
        <main class="card">
            <table>
                <thead>
                    <tr>
                        <th>Apelido</th>
                        <th>ID RustDesk</th>
                        <th>Dispositivo</th>
                        <th>Senha</th>
                        <th>Criado em</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="clientsTableBody">
                    
                </tbody>
            </table>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
